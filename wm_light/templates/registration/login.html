{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <title>Log in | WM (Light)</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="{% static 'css/tabler.min.css' %}" />
        <link rel="stylesheet" href="{% static 'css/custom.css' %}" />
    </head>
    <body class="d-flex flex-column">
        <div class="page page-center">
            <div class="container container-tight py-4">
                <div class="text-center mb-4">
                    <img src="{% static 'images/logo.png' %}" alt="WM (Light)" height="60">
                </div>
                <div class="card card-md">
                    <div class="card-body">
                        <h2 class="h2 text-center mb-4">Log in</h2>
                        <form method="post" novalidate>
                            {% csrf_token %}
                            {% if form.errors %}
                                <div class="alert alert-danger">Wrong username or password.</div>
                            {% endif %}
                            <div class="mb-3">
                                <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
                                <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" autofocus required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
                                <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required>
                            </div>
                            <input type="hidden" name="next" value="{{ next }}">
                            <button type="submit" class="btn btn-primary w-100">Log in</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <script src="{% static 'js/tabler.min.js' %}"></script>
    </body>
</html>
